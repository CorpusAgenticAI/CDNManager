{% extends "base.html" %}
{% block title %}Audit · CDN Manager{% endblock %}
{% block body %}
<h1 class="text-2xl font-semibold mb-4">Audit</h1>
{% for row in rows %}
<div class="border-t border-slate-800 py-2 text-sm"><span class="text-slate-500">{{ row.at|when }}</span> {{ row.actor }} · {{ row.action }} <span class="font-mono text-xs text-slate-400">{{ row.detail }}</span></div>
{% endfor %}
<form method="post" action="/webhooks" class="mt-6 flex gap-2">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input name="url" placeholder="https://billing.example/hooks/cdn" required class="flex-1 rounded-md bg-slate-900 border border-slate-700 px-3 py-2">
  <button class="rounded-md border border-slate-600 px-3">Add webhook</button>
</form>
{% endblock %}
