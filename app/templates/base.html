<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CDN Manager{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "sans-serif"], mono: ["JetBrains Mono", "monospace"] } } } }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <meta name="csrf" content="{{ csrf }}">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-60 shrink-0 border-r border-slate-800 bg-slate-900/80 p-4 flex flex-col">
      <div class="mb-8">
        <div class="text-xs uppercase tracking-widest text-teal-300">Corpus</div>
        <div class="text-lg font-semibold">CDN Manager</div>
        <div class="text-xs text-slate-400 mt-1">{{ user.role }} · {{ user.username }}</div>
      </div>
      <nav class="space-y-1 flex-1">
        {% for href, label in nav %}
        <a href="{{ href }}" class="block rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white">{{ label }}</a>
        {% endfor %}
      </nav>
      <form method="post" action="/logout">
        <button class="text-sm text-slate-400 hover:text-white" type="submit">Sign out</button>
      </form>
      <div class="mt-3 text-[11px] text-slate-500">Sessions: {{ session_backend }}</div>
    </aside>
    <main class="flex-1 p-6 lg:p-8 overflow-auto">
      {% block body %}{% endblock %}
    </main>
  </div>
  <script>
    document.body.addEventListener("htmx:configRequest", (event) => {
      const token = document.querySelector('meta[name="csrf"]').content;
      event.detail.headers["X-CSRF-Token"] = token;
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
