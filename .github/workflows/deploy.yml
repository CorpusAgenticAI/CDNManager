name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build, migrate, deploy (Cloud Build)
        run: |
          gcloud builds submit \
            --project="$PROJECT" \
            --config=cloudbuild.yaml \
            --gcs-source-staging-dir="gs://${PROJECT}-cdnmanager-build/source" \
            --substitutions="_REGION=${REGION}" \
            .

      - name: Check readiness
        run: |
          url="$(gcloud run services describe cdnmanager --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          curl -fsS --retry 5 --retry-delay 5 "$url/readyz"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
